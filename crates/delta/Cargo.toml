[package]
name = "company-delta"
version = "0.10.3"
license = "AGPL-3.0-or-later"
authors = ["Paul Makles <paulmakles@gmail.com>"]
edition = "2018"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Test
rand = "0.8.5"
redis-kiss = { version = "0.1.4", default-features = false, features = ["tokio-runtime"] }

# Utility
lru = "0.7.0"
url = "2.2.2"
log = "0.4.11"
dashmap = "5.2.0"
linkify = "0.6.0"
once_cell = "1.17.1"
env_logger = "0.7.1"

# Lang. Utilities
regex = "1"
num_enum = "0.5.1"
impl_ops = "0.1.1"
bitfield = "0.13.2"

# ID / key generation
ulid = "0.4.1"
nanoid = "0.4.0"

# serde
serde_json = "1.0.57"
serde = { version = "1.0.115", features = ["derive"] }
validator = { version = "0.16", features = ["derive"] }
iso8601-timestamp = { version = "0.2.11", features = [] }

# async
futures = "0.3.8"
chrono = { version = "0.4.15", features = ["serde"] }
async-channel = "1.6.1"
reqwest = { version = "0.11.4", features = ["json"] }
async-std = { version = "1.8.0", features = [
    "tokio1",
    "tokio02",
    "attributes",
] }

# internal util
lettre = "0.10.0-alpha.4"

# web

rocket = { version = "0.5.1", default-features = false, features = ["json"] }
rocket_cors = "0.6.0"
rocket_empty = { version = "0.1.1", features = ["schema"] }
rocket_authifier = { version = "1.0.15" }
rocket_prometheus = "0.10.0-rc.3"

# spec generation
schemars = "0.8.8"
revolt_rocket_okapi = { version = "0.10.0", features = ["swagger"] }

# rabbit
amqprs = { version = "1.7.0" }

# core
authifier = "1.0.15"
company-config = { path = "../core/config" }
company-database = { path = "../core/database", features = [
    "rocket-impl",
    "voice",
] }
company-models = { path = "../core/models", features = [
    "schemas",
    "validator",
    "rocket",
] }
company-presence = { path = "../core/presence" }
company-result = { path = "../core/result", features = ["rocket", "okapi"] }
company-permissions = { path = "../core/permissions", features = ["schemas"] }
company-ratelimits = { path = "../core/ratelimits", features = ["rocket"] }

# voice
livekit-api = "0.4.14"
livekit-protocol = "0.7.1"

# license signing
rsa = { version = "0.9", features = ["pem"] }
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"

# payments (Stripe webhook signature verification)
hmac = "0.12"

# image dimension detection for message attachments
imagesize = "0.13.0"

# training data pipeline (double encryption + JWT consent)
aes-gcm = "0.10"
jsonwebtoken = "9.0"

# cosmetics moderation proxy (Phase 3e)
urlencoding = "2.1"

[build-dependencies]
vergen = "7.5.0"
